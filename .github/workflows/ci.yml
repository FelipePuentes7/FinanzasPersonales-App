name: CI - Calidad, Seguridad y Pruebas (Bolsillo v1.0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Pytest, Cobertura y Ruff AppSec (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar linter estático y de seguridad (Ruff E, F, B, S)
        run: ruff check --select E,F,B,S .

      - name: Ejecutar suite de pruebas automatizadas y medir cobertura
        run: pytest --cov=src -v
