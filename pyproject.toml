[project]
name = "finanzas-personales-app"
version = "0.1.0"
description = "Asistente Web para Registro y Análisis de Gastos Personales mediante IA"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
